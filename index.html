<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101713"><title>انیار | مدیریت کافه</title>
<style>
:root{--bg:#0c110e;--s:#151d18;--s2:#1b261f;--b:#29372d;--t:#eef4ef;--m:#9ba99e;--a:#8fbd78;--d:#e58a80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;line-height:1.6}body.light{--bg:#f2f6f2;--s:#fff;--s2:#eaf0eb;--b:#d6e0d7;--t:#17221a;--m:#657367;--a:#477b45;--d:#c94f45}button,input,select{font:inherit}button{cursor:pointer;color:var(--t);background:var(--s);border:1px solid var(--b);border-radius:12px;padding:9px 12px}input,select{background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:11px;padding:10px;width:100%}.app{max-width:760px;margin:auto;padding:0 14px 95px}.head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;padding:12px 0;z-index:3}.brand{display:flex;gap:10px;align-items:center}.logo{background:var(--s2);color:var(--a);border-radius:13px;width:40px;height:40px;display:grid;place-items:center;font-weight:900;font-size:21px}.brand h1{margin:0;font-size:18px}.muted{color:var(--m);font-size:13px}.actions{display:flex;gap:6px}.view{display:grid;gap:12px;padding-top:13px}.card{background:var(--s);border:1px solid var(--b);border-radius:17px;padding:15px}.card h2,.card h3{margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:var(--s2);padding:12px;border-radius:13px}.stat small{display:block;color:var(--m)}.stat strong{font-size:18px;overflow-wrap:anywhere}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.list{display:grid}.entry{padding:12px 0;border-bottom:1px solid var(--b)}.entry:last-child{border:0}.tag{font-size:12px;color:var(--m);background:var(--s2);border-radius:20px;padding:3px 8px}.warn{color:var(--d)}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid var(--b);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:5;max-width:760px;margin:auto}.nav button{border:0;background:transparent;color:var(--m);display:grid;justify-items:center;font-size:12px;padding:5px}.nav button.active{color:var(--a);background:var(--s2)}.nav i{font-style:normal;font-size:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:grid;gap:4px}.field label{color:var(--m);font-size:12px}.full{grid-column:1/-1}.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.primary{background:var(--s2);border-color:var(--a);color:var(--a);font-weight:700}.danger{color:var(--d)}.line{display:grid;grid-template-columns:1.15fr .7fr .9fr 34px;gap:5px;margin:8px 0}.line input,.line select{padding:7px}.empty{text-align:center;color:var(--m);padding:20px}.modalbg{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{background:var(--s);border:1px solid var(--b);border-radius:20px;padding:16px;width:min(100%,720px);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);z-index:20;background:var(--s2);padding:10px 15px;border:1px solid var(--b);border-radius:12px;max-width:90%}.bars{display:grid;gap:7px}.barrow{display:grid;grid-template-columns:60px 1fr 65px;gap:7px;align-items:center;font-size:12px}.bar{height:9px;background:var(--s2);border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--a)}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.modalbg{align-items:center}}
</style></head><body><div class="app"><header class="head"><div class="brand"><div class="logo">ا</div><div><h1>انیار</h1><div class="muted">مدیریت خرید و انبار کافه</div></div></div><div class="actions"><button id="theme" title="تم">☀️</button><button id="settings" title="تنظیمات">⚙️</button><button id="account" title="حساب ابری">☁️</button></div></header><main id="view" class="view"><section class="card empty">در حال آماده‌سازی…</section></main></div><nav id="nav" class="nav"></nav><div id="modalroot"></div><div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const KEY='aniar.rebuilt.v1',OWNER='aniar.owner.v1',THEME='aniar.theme.v1';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=x=>Math.max(0,Number(x)||0),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),money=x=>n(x).toLocaleString('fa-IR')+' تومان',date=x=>new Date(x+'T12:00:00').toLocaleDateString('fa-IR');
let S={products:[],purchases:[],events:[],tab:'invoice'},user=null,ready=false,busy=false,timer=null;function toast(m,err=false){let t=$('#toast');t.textContent=m;t.hidden=false;t.style.borderColor=err?'var(--d)':'var(--b)';clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,3200)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({products:S.products,purchases:S.purchases,events:S.events}))}catch(e){toast('ذخیره محلی ممکن نشد',true)}if(user&&ready){clearTimeout(timer);timer=setTimeout(sync,700)}}
function load(){try{let raw=localStorage.getItem(KEY),d=raw?JSON.parse(raw):JSON.parse(localStorage.getItem('aniar.v1')||'{}');let x=migrate(d);S.products=x.products;S.purchases=x.purchases;S.events=x.events;localStorage.setItem(KEY,JSON.stringify(x))}catch(e){console.error('load/migrate',e);toast('ذخیره قبلی خوانده نشد؛ بکاپ قبلی را نگه دار',true)}}
function migrate(d){if(!d||typeof d!=='object')return{products:[],purchases:[],events:[]};if(Array.isArray(d.purchases))return{products:(d.products||[]).map(p=>({...p,initial:n(p.initial??0),alert:n(p.alert??p.min),price:n(p.price??p.cost)})),purchases:d.purchases,events:d.events||[]};let products=(d.products||[]).map(p=>({...p,initial:n(p.initial??0),alert:n(p.alert??p.min),price:n(p.price??p.cost)}));let invoices=(d.invoices||[]).filter(i=>i.type!=='sale'&&i.type!=='expense');let purchases=invoices.map(i=>({id:i.id||id(),date:new Date(i.t||Date.now()).toISOString().slice(0,10),discount:n(i.invDisc),applyStock:i.applyStock!==false,items:(i.items||[]).map(it=>({pid:it.pid,qty:n(it.qty),price:n(it.price),off:n(it.disc)}))}));let events=[];(d.events||[]).forEach(e=>{if(!products.some(x=>x.id===e.pid))return;let delta=Number(e.delta)||0;if(e.kind==='init'&&delta>0){let p=products.find(x=>x.id===e.pid);p.initial=n(p.initial)+delta;return}if(e.invoiceId||e.kind==='buy')return;if(delta!==0)events.push({id:e.id||id(),pid:e.pid,kind:delta<0?'use':'adj',qty:Math.abs(delta),date:new Date(e.t||Date.now()).toISOString().slice(0,10),note:'مهاجرت سوابق نسخه قبلی'})});purchases.forEach(p=>{if(p.applyStock!==false)p.items.forEach(it=>events.push({id:id(),purchaseId:p.id,pid:it.pid,kind:'buy',qty:it.qty,date:p.date}))});return{products,purchases,events}}
function nav(){let ts=[['invoice','ثبت خرید','🧾'],['history','تاریخچه','📚'],['stock','انبار','📦'],['report','گزارش','📊']];$('#nav').innerHTML=ts.map(([k,l,ic])=>'<button data-tab="'+k+'" class="'+(S.tab===k?'active':'')+'"><i>'+ic+'</i>'+l+'</button>').join('')}
function render(){nav();try(({invoice:invoice,history:history,stock:stockView,report:report}[S.tab]||invoice)($('#view'))}catch(e){console.error(e);$('#view').innerHTML='<section class="card"><h2>خطا در نمایش این بخش</h2><p class="muted">اطلاعات محفوظ است. دوباره تلاش کن.</p><button onclick="location.reload()">بارگذاری دوباره</button></section>'}}
function invoice(v){v.innerHTML='<section class="card"><h2>ثبت خرید</h2><div class="form"><div class="field"><label>تاریخ</label><input type="date" id="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>تخفیف کل (تومان)</label><input id="discount" type="number" value="0"></div></div><div id="lines"></div><div class="btnrow"><button id="add">＋ افزودن قلم</button><button id="newp">＋ کالای جدید</button></div><div class="row" style="margin-top:10px"><b>جمع کل</b><b id="total">۰ تومان</b></div><button class="primary" id="savebuy" style="width:100%;margin-top:12px">ثبت خرید</button></section><section class="card"><h3>هشدار موجودی</h3>'+alerts().map(p=>'<div class="entry row"><span>'+esc(p.name)+'</span><b class="warn">'+stock(p)+' '+esc(p.unit)+'</b></div>').join('')||'<p class="muted">هشدار موجودی نداریم.</p>'+'</section>';let lines=[];function draw(){let h=$('#lines');h.innerHTML=lines.map((l,i)=>'<div class="line"><select data-i="'+i+'" data-k="pid">'+S.products.map(p=>'<option value="'+p.id+'" '+(p.id===l.pid?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select><input type="number" min=".001" step=".001" data-i="'+i+'" data-k="qty" value="'+l.qty+'"><input type="number" min="0" data-i="'+i+'" data-k="price" value="'+l.price+'"><button data-x="'+i+'">×</button></div>').join('')||'<p class="empty">قلمی اضافه نشده است.</p>';h.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{let l=lines[e.dataset.i],k=e.dataset.k;l[k]=k==='pid'?e.value:n(e.value);if(k==='pid')l.price=n(S.products.find(p=>p.id===l.pid)?.price);draw()});h.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{lines.splice(+e.dataset.x,1);draw()});calc()}function calc(){$('#total').textContent=money(Math.max(0,lines.reduce((s,l)=>s+n(l.qty)*n(l.price)-n(l.off),0)-n($('#discount').value)))}$('#add').onclick=()=>{if(!S.products.length){toast('اول کالا تعریف کن',true);return}let p=S.products[0];lines.push({pid:p.id,qty:1,price:n(p.price),off:0});draw()};$('#newp').onclick=()=>productModal();$('#discount').oninput=calc;$('#savebuy').onclick=()=>{if(!lines.length||lines.some(l=>!l.pid||!n(l.qty))){toast('قلم خرید و مقدار معتبر وارد کن',true);return}let p={id:id(),date:$('#date').value||new Date().toISOString().slice(0,10),discount:n($('#discount').value),items:lines.map(x=>({...x}))};S.purchases.unshift(p);purchaseEvents(p);save();render();toast('خرید ثبت شد')};draw()}
function history(v){let html=S.purchases.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(p=>'<div class="entry"><div class="row"><b>'+date(p.date)+'</b><b>'+money(totals(p))+'</b></div><div class="muted">'+p.items.map(i=>esc(S.products.find(x=>x.id===i.pid)?.name||'کالای حذف شده')+' × '+n(i.qty)).join('، ')+'</div><div class="btnrow"><button data-edit="'+p.id+'">ویرایش</button><button class="danger" data-delete="'+p.id+'">حذف</button></div></div>').join('');v.innerHTML='<section class="card"><h2>تاریخچه خرید</h2>'+(html||'<p class="empty">هنوز خریدی ثبت نشده است.</p>')+'</section>';v.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('خرید حذف شود و موجودی اصلاح شود؟')){S.purchases=S.purchases.filter(p=>p.id!==b.dataset.delete);S.events=S.events.filter(e=>e.purchaseId!==b.dataset.delete);save();render();toast('حذف شد')}});v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editPurchase(b.dataset.edit))}function editPurchase(pid){let p=S.purchases.find(x=>x.id===pid);open('ویرایش فاکتور','<div class="form"><div class="field"><label>تاریخ</label><input id="eddate" type="date" value="'+p.date+'"></div><div class="field"><label>تخفیف</label><input id="edoff" type="number" value="'+n(p.discount)+'"></div></div><div id="edlines"></div><button id="edadd">＋ قلم</button><button class="primary" id="edsave" style="width:100%;margin-top:10px">ذخیره و اصلاح موجودی</button>');let L=p.items.map(x=>({...x}));function draw(){let h=$('#edlines');h.innerHTML=L.map((l,i)=>'<div class="line"><select data-i="'+i+'" data-k="pid">'+S.products.map(x=>'<option value="'+x.id+'" '+(x.id===l.pid?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><input data-i="'+i+'" data-k="qty" type="number" step=".001" value="'+l.qty+'"><input data-i="'+i+'" data-k="price" type="number" value="'+l.price+'"><button data-x="'+i+'">×</button></div>').join('');h.querySelectorAll('[data-i]').forEach(e=>e.onchange=()=>{let l=L[e.dataset.i],k=e.dataset.k;l[k]=k==='pid'?e.value:n(e.value);draw()});h.querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{L.splice(+e.dataset.x,1);draw()})}draw();$('#edadd').onclick=()=>{if(S.products.length){let x=S.products[0];L.push({pid:x.id,qty:1,price:n(x.price),off:0});draw()}};$('#edsave').onclick=()=>{p.date=$('#eddate').value;p.discount=n($('#edoff').value);p.items=L;purchaseEvents(p);save();close();render();toast('فاکتور اصلاح شد')}}
function stockView(v){let rows=S.products.map(p=>'<div class="entry"><div class="row"><b>'+esc(p.name)+'</b><span class="tag '+(stock(p)<=n(p.alert)?'warn':'')+'">'+stock(p)+' '+esc(p.unit)+'</span></div><div class="muted">حد هشدار '+n(p.alert)+' '+esc(p.unit)+' · قیمت '+money(p.price)+'</div><div class="btnrow"><button data-editp="'+p.id+'">ویرایش</button><button class="danger" data-delp="'+p.id+'">حذف</button></div></div>').join('');v.innerHTML='<section class="card"><div class="row"><h2>انبار</h2><button id="addproduct" class="primary">＋ کالا</button></div><div class="btnrow"><button id="consume">ثبت مصرف</button><button id="adjust">اصلاح موجودی</button></div>'+(rows||'<p class="empty">کالایی ثبت نشده.</p>')+'</section>';$('#addproduct').onclick=()=>productModal();$('#consume').onclick=()=>consumeModal();$('#adjust').onclick=()=>adjustModal();v.querySelectorAll('[data-editp]').forEach(b=>b.onclick=()=>productModal(b.dataset.editp));v.querySelectorAll('[data-delp]').forEach(b=>b.onclick=()=>{if(confirm('کالا و سوابق مربوط پاک شوند؟')){S.events=S.events.filter(e=>e.pid!==b.dataset.delp);S.products=S.products.filter(p=>p.id!==b.dataset.delp);save();render()}})}function productModal(pid){let p=S.products.find(x=>x.id===pid)||{name:'',unit:'عدد',initial:0,alert:0,price:0};open(pid?'ویرایش کالا':'کالای جدید','<div class="form"><div class="field full"><label>نام کالا</label><input id="pn" value="'+esc(p.name)+'"></div><div class="field"><label>واحد</label><input id="pu" value="'+esc(p.unit)+'"></div><div class="field"><label>موجودی اولیه</label><input id="pi" type="number" step=".001" value="'+n(p.initial)+'"></div><div class="field"><label>حد هشدار</label><input id="pa" type="number" step=".001" value="'+n(p.alert)+'"></div><div class="field"><label>قیمت مرجع</label><input id="pp" type="number" value="'+n(p.price)+'"></div></div><button class="primary" id="psave" style="width:100%;margin-top:12px">ذخیره</button>');$('#psave').onclick=()=>{let name=$('#pn').value.trim();if(!name){toast('نام کالا وارد شود',true);return}if(pid){p.name=name;p.unit=$('#pu').value||'عدد';p.alert=n($('#pa').value);p.price=n($('#pp').value)}else S.products.push({id:id(),name,unit:$('#pu').value||'عدد',initial:n($('#pi').value),alert:n($('#pa').value),price:n($('#pp').value)});save();close();render();toast('کالا ذخیره شد')}}
function consumeModal(){if(!S.products.length){toast('کالا تعریف نشده',true);return}open('ثبت مصرف','<div class="form"><div class="field full"><label>کالا</label><select id="cp">'+S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · موجودی '+stock(p)+' '+esc(p.unit)+'</option>').join('')+'</select></div><div class="field"><label>مقدار</label><input id="cq" type="number" min=".001" step=".001"></div><div class="field"><label>تاریخ</label><input id="cd" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field full"><label>یادداشت</label><input id="cn"></div></div><button id="csave" class="primary" style="width:100%;margin-top:10px">ثبت مصرف</button>');$('#csave').onclick=()=>{let p=S.products.find(x=>x.id===$('#cp').value),q=n($('#cq').value);if(!q){toast('مقدار مصرف لازم است',true);return}if(q>stock(p)&&!confirm('مصرف بیش از موجودی ثبت شود؟'))return;S.events.push({id:id(),pid:p.id,kind:'use',qty:q,date:$('#cd').value,note:$('#cn').value});save();close();render();toast('مصرف ثبت شد')}}
function adjustModal(){if(!S.products.length)return toast('کالایی نداریم',true);open('اصلاح موجودی','<div class="field"><label>کالا</label><select id="ap">'+S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' ( '+stock(p)+' '+esc(p.unit)+' )</option>').join('')+'</select></div><div class="field"><label>موجودی واقعی جدید</label><input id="aq" type="number" step=".001"></div><button class="primary" id="asave" style="width:100%;margin-top:10px">ثبت</button>');$('#asave').onclick=()=>{let p=S.products.find(x=>x.id===$('#ap').value),delta=n($('#aq').value)-stock(p);S.events.push({id:id(),pid:p.id,kind:'adj',qty:delta,date:new Date().toISOString().slice(0,10)});save();close();render();toast('اصلاح موجودی انجام شد')}}
function report(v){let sum=S.purchases.reduce((a,p)=>a+totals(p),0),low=alerts(),days=[];for(let k=6;k>=0;k--){let d=new Date();d.setDate(d.getDate()-k);let key=d.toISOString().slice(0,10);days.push({key,label:d.toLocaleDateString('fa-IR',{weekday:'short'}),value:S.purchases.filter(p=>p.date===key).reduce((a,p)=>a+totals(p),0)})}let max=Math.max(1,...days.map(x=>x.value)),cost={};S.purchases.forEach(p=>p.items.forEach(i=>cost[i.pid]=(cost[i.pid]||0)+n(i.qty)*n(i.price)));let top=Object.entries(cost).sort((a,b)=>b[1]-a[1]).slice(0,5);let chart=days.map(d=>'<div class="barrow"><span>'+d.label+'</span><div class="bar"><span style="width:'+d.value/max*100+'%"></span></div><span>'+short(d.value)+'</span></div>').join('');let tops=top.map(([pid,x])=>'<div class="entry row"><span>'+esc(S.products.find(p=>p.id===pid)?.name||'حذف شده')+'</span><b>'+money(x)+'</b></div>').join('');let lows=low.map(p=>'<div class="entry row">'+esc(p.name)+'<b class="warn">'+stock(p)+' '+esc(p.unit)+'</b></div>').join('');v.innerHTML='<section class="card"><h2>خلاصه گزارش</h2><div class="grid"><div class="stat"><small>کل خریدها</small><strong>'+money(sum)+'</strong></div><div class="stat"><small>تعداد فاکتور</small><strong>'+S.purchases.length.toLocaleString('fa-IR')+'</strong></div><div class="stat"><small>تعداد کالا</small><strong>'+S.products.length.toLocaleString('fa-IR')+'</strong></div><div class="stat"><small>هشدار انبار</small><strong>'+low.length.toLocaleString('fa-IR')+'</strong></div></div></section><section class="card"><h3>خرید هفته</h3><div class="bars">'+chart+'</div></section><section class="card"><h3>بیشترین هزینه کالا</h3>'+(tops||'<p class="muted">هنوز داده‌ای برای گزارش نداریم.</p>')+'</section><section class="card"><h3>کالاهای کم‌موجودی</h3>'+(lows||'<p class="muted">مورد هشدار نداریم.</p>')+'</section>'}function short(x){return x>=1e6?(x/1e6).toFixed(1)+'م':x>=1e3?(x/1e3).toFixed(0)+'هزار':n(x).toLocaleString('fa-IR')}
function open(title,html){$('#modalroot').innerHTML='<div class="modalbg" id="bg"><div class="modal"><div class="modalhead"><h3>'+esc(title)+'</h3><button id="close">×</button></div>'+html+'</div></div>';$('#close').onclick=close;$('#bg').onclick=e=>{if(e.target.id==='bg')close()}}
function close(){$('#modalroot').innerHTML=''}
function settings(){open('تنظیمات','<h3>پشتیبان‌گیری</h3><p class="muted">خروجی JSON شامل کالاها، خریدها و رویدادهای انبار است.</p><div class="btnrow"><button id="backup">دانلود بکاپ</button><button id="restore">بازیابی بکاپ</button></div><input type="file" id="file" accept="application/json" hidden><div class="hr"></div><p class="muted">'+(user?'حساب متصل: '+esc(user.email):'حالت ذخیره محلی فعال است')+'</p><button id="login">'+(user?'خروج از حساب':'ورود / ساخت حساب ابری')+'</button><div class="hr"></div><button class="danger" id="wipe">پاک کردن داده محلی</button>');$('#backup').onclick=backup;$('#restore').onclick=()=>$('#file').click();$('#file').onchange=restore;$('#login').onclick=()=>{close();account()};$('#wipe').onclick=()=>{if(confirm('همه داده‌های محلی پاک شود؟')){S={products:[],purchases:[],events:[],tab:'invoice'};save();render();close();toast('داده محلی پاک شد')}}}
function backup(){let blob=new Blob([JSON.stringify({app:'Aniar',version:2,products:S.products,purchases:S.purchases,events:S.events},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='aniar-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function restore(e){let f=e.target.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.purchases)||!Array.isArray(d.events))throw Error();if(!confirm('اطلاعات فعلی جایگزین شود؟'))return;S.products=d.products;S.purchases=d.purchases;S.events=d.events;save();close();render();toast('بکاپ بازیابی شد')}catch(e){toast('فایل بکاپ معتبر نیست',true)}};r.readAsText(f)}

function timeout(p,ms=12000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(Error('اتصال زمان‌بر شد')),ms))])}
function account(){if(user){if(confirm('خروج از حساب ابری؟'))logout();return}open('ورود به فضای ابری','<p class="muted">برای همگام‌سازی اطلاعات در دستگاه‌های مختلف وارد شو.</p><div class="field"><label>ایمیل</label><input id="email" type="email"></div><div class="field"><label>رمز</label><input id="pass" type="password"></div><div class="btnrow"><button class="primary" id="signin">ورود</button><button id="signup">ساخت حساب</button></div><p class="muted" id="authmsg"></p>');$('#signin').onclick=()=>auth('signin');$('#signup').onclick=()=>auth('signup')}
async function auth(mode){let em=$('#email').value.trim(),pw=$('#pass').value,m=$('#authmsg');if(!em||!pw){m.textContent='ایمیل و رمز را وارد کن';return}if(!sb){m.textContent='کتابخانه ابری بارگذاری نشد؛ ذخیره محلی فعال است.';return}m.textContent='در حال اتصال…';try{let x=mode==='signup'?await timeout(sb.auth.signUp({email:em,password:pw})):await timeout(sb.auth.signInWithPassword({email:em,password:pw}));if(x.error)throw x.error;if(mode==='signup'&&!x.data.session){m.textContent='حساب ساخته شد. ایمیل تأیید را بررسی کن.';return}if(x.data.session){await boot(x.data.session.user);close();render();toast('ورود موفق')}}catch(e){m.textContent=e.message||'ورود ناموفق'}}
async function boot(u){user=u;ready=false;try{let r=await timeout(sb.from('aniar_user_data').select('data').eq('user_id',u.id).maybeSingle());if(r.error)throw r.error;let prev=localStorage.getItem(OWNER),d=r.data?.data;if(d){let x=migrate(d);S.products=x.products;S.purchases=x.purchases;S.events=x.events;await cloudWrite()}else if(prev&&prev!==u.id){S.products=[];S.purchases=[];S.events=[];await cloudWrite()}else await cloudWrite();localStorage.setItem(OWNER,u.id);ready=true;save()}catch(e){ready=false;toast('همگام‌سازی ابری انجام نشد؛ داده محلی محفوظ است',true);console.error(e)}}async function cloudWrite(){if(!sb||!user)return;let r=await timeout(sb.from('aniar_user_data').upsert({user_id:user.id,data:{products:S.products,purchases:S.purchases,events:S.events},updated_at:new Date().toISOString()},{onConflict:'user_id'}));if(r.error)throw r.error}
async function sync(){if(!user||!ready||busy)return;busy=true;try{await cloudWrite()}catch(e){toast('همگام‌سازی ناموفق؛ ذخیره محلی محفوظ است',true)}finally{busy=false}}
async function logout(){try{await sb?.auth.signOut()}catch(e){}user=null;ready=false;render();toast('خروج انجام شد')}
$('#theme').onclick=()=>{document.body.classList.toggle('light');localStorage.setItem(THEME,document.body.classList.contains('light')?'light':'dark');$('#theme').textContent=document.body.classList.contains('light')?'🌙':'☀️'};$('#settings').onclick=settings;$('#account').onclick=account;$('#nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){S.tab=b.dataset.tab;render()}};if(localStorage.getItem(THEME)==='light')document.body.classList.add('light');load();render();if(sb){timeout(sb.auth.getSession(),9000).then(({data})=>{if(data.session?.user)boot(data.session.user).then(render)}).catch(e=>console.warn('session check',e));sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){user=null;ready=false;render()}})}
})();
