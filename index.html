<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>انیار</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0d0b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, scrolling card stack, fixed four-tab bar, bottom sheets for forms. */
:root{
  --bg:#0b0d0b;
  --surface:#121612;
  --surface-2:#181d18;
  --line:#252c26;
  --fg:#e8ede7;
  --muted:#8c968d;
  --green:#1d5a3f;
  --green-hi:#2f8a61;
  --green-deep:#123626;
  --accent:#74d3a4;
  --red:#8c2128;
  --red-deep:#3d1114;
  --red-fg:#ff9ea4;
  --font:'Vazirmatn',system-ui,'Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{direction:rtl}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;
  min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea{font-family:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;flex:none}
.brand h1{font-size:22px;font-weight:800;letter-spacing:0;line-height:1.2}
.brand p{font-size:12.5px;color:var(--muted)}
.icon-btn{
  width:42px;height:42px;flex:none;border-radius:13px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--muted)
}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.sm{width:36px;height:36px;border-radius:11px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec-title{font-size:13px;color:var(--muted);font-weight:700;margin-block:6px 0}

/* controls */
.btn{
  border:0;border-radius:var(--r);padding:12px 16px;min-height:46px;background:var(--green);color:#eaf6ee;
  font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .12s ease,background .15s ease
}
.btn:active{transform:scale(.98);background:var(--green-deep)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--fg)}
.btn.ghost:active{background:var(--surface-2)}
.btn.danger{background:var(--red-deep);color:var(--red-fg);border:1px solid var(--red)}
.btn.danger:active{background:#2c0b0d}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px}
.btn:focus-visible,.icon-btn:focus-visible,.nav button:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input,textarea{
  width:100%;background:#0e110e;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:46px;
}
textarea{min-height:120px;resize:vertical;font-size:13px;direction:ltr;text-align:left}
input::placeholder,textarea::placeholder{color:#566058}
input:focus,textarea:focus{border-color:var(--green-hi);outline:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
label.f>input{color:var(--fg)}

.seg{display:flex;background:#0e110e;border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:11px;font-weight:700;font-size:14px;cursor:pointer;min-height:38px;white-space:nowrap}
.seg button.on{background:var(--green);color:#eaf6ee}
.seg.mini{flex:none}
.seg.mini button{padding:8px 12px}

.stepper{display:flex;direction:ltr;align-items:stretch;gap:6px}
.stepper input{text-align:center;padding-inline:4px;min-width:0}
.stepper button{flex:none;width:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;font-size:20px;cursor:pointer;color:var(--fg)}
.stepper button:active{background:var(--green-deep)}

.chip{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--accent);border-color:var(--green)}
.chip.low{color:var(--red-fg);border-color:var(--red)}
.chip.empty{background:var(--red-deep);color:var(--red-fg);border-color:var(--red)}
.chip.buy{color:#e2c98a;border-color:#5b4c22}

/* invoice */
.line{display:flex;flex-direction:column;gap:10px}
.line-top{display:flex;gap:8px}
.line-sum{display:flex;justify-content:space-between;align-items:baseline;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.line-sum b{font-size:17px;color:var(--fg);font-weight:800}
.line-sum .ld{color:var(--red-fg);font-size:12.5px;margin-inline-start:8px}
.hint{font-size:12px;color:var(--muted);min-height:0}
.hint.bad{color:var(--red-fg)}
.hint:empty{display:none}
.disc-row{display:flex;gap:10px;align-items:flex-end}
.disc-row label{flex:1}
.summary{display:flex;flex-direction:column;gap:8px}
.summary .r{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.summary .r span:last-child{color:var(--fg)}
.summary .r.neg span:last-child{color:var(--red-fg)}
.grand{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px;border-top:1px solid var(--line)}
.grand span{font-weight:700}
.grand b{font-size:30px;font-weight:800;color:var(--accent);line-height:1.2}
.grand small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:4px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);cursor:pointer;padding:2px 2px}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--green-hi);flex:none}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.actions .btn.grow{flex:2}

/* inventory */
.prod{display:flex;flex-direction:column;gap:12px;cursor:pointer}
.prod-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prod h3{font-size:17px;font-weight:700;line-height:1.4}
.prod .sub{font-size:12.5px;color:var(--muted)}
.stock{display:flex;align-items:baseline;gap:8px}
.stock b{font-size:30px;font-weight:800;line-height:1.1}
.stock span{color:var(--muted);font-size:14px}
.prod.is-low .stock b{color:var(--red-fg)}
.life{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.life div{background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.life small{display:block;font-size:11.5px;color:var(--muted);line-height:1.4}
.life strong{font-size:14px;font-weight:700}
.life div.est strong{color:var(--accent)}

/* history */
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-block:10px 2px;font-size:13px;color:var(--muted);font-weight:700}
.inv{cursor:pointer}
.inv-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inv-top .t{font-size:13px;color:var(--muted)}
.inv-top .tot{font-weight:800;font-size:17px}
.inv-items{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px;cursor:default}
.inv-items .it{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.inv-items .it span:first-child{min-width:0;overflow-wrap:anywhere}
.inv-items .it span:last-child{white-space:nowrap}
.inv-items .tot-r{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* report */
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{font-size:12.5px;color:var(--muted)}
.stat b{font-size:20px;font-weight:800;line-height:1.3;overflow-wrap:anywhere}
.stat b em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500;margin-inline-start:3px}
.stat.good b{color:var(--accent)}
.stat.bad b{color:var(--red-fg)}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart .bar{fill:var(--green)}
.chart .bar.today{fill:var(--green-hi)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--font);font-size:10px}
.chart .gl{paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.rank{display:flex;flex-direction:column;gap:10px}
.rank .it{display:flex;flex-direction:column;gap:4px}
.rank .it .h{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.rank .it .h span:first-child{min-width:0;overflow-wrap:anywhere}
.rank .it .h span:last-child{white-space:nowrap;color:var(--muted)}
.rank .meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.rank .meter i{display:block;height:100%;background:var(--green-hi);border-radius:99px}
.alert{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--red-deep);border:1px solid var(--red);color:var(--red-fg);font-size:14px}
.alert b{font-weight:700;overflow-wrap:anywhere}

/* empty state */
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:64px;height:64px;color:var(--green-hi)}
.empty h3{font-size:17px}
.empty p{color:var(--muted);font-size:14px;max-width:30ch}

/* nav */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:25;background:rgba(11,13,11,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))
}
.nav button{
  border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12px;font-weight:600;padding:7px 0;border-radius:14px;cursor:pointer;position:relative
}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--accent);background:var(--green-deep)}
.nav .badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}

/* sheet */
.sheetwrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet{
  position:relative;width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;
  border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:up .22s ease-out
}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:12px}
.sheet .stack{gap:12px}
.cyc{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface-2);border-radius:12px;font-size:13.5px}
.cyc .d{white-space:nowrap;font-weight:700}
.cyc .d.live{color:var(--accent)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--green-deep);border:1px solid var(--green);color:#eaf6ee;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;
  max-width:calc(100% - 32px);text-align:center
}
.toast.bad{background:var(--red-deep);border-color:var(--red);color:var(--red-fg)}
/* Light theme */
:root.light-theme{
  --bg:#f4f6f3;--surface:#ffffff;--surface-2:#e9eee9;--line:#d5ddd5;
  --fg:#202820;--muted:#647064;--green:#246b49;--green-hi:#2f8a61;--green-deep:#dceee3;
  --accent:#246b49;--red:#a82c35;--red-deep:#f8e4e5;--red-fg:#9a2029;color-scheme:light;
}
:root.light-theme body::before{background:var(--bg)}
:root.light-theme .icon-btn{background:var(--surface);color:var(--muted)}
:root.light-theme input,:root.light-theme textarea,:root.light-theme .seg{background:#fff;color:var(--fg)}
:root.light-theme input::placeholder,:root.light-theme textarea::placeholder{color:#899489}
:root.light-theme .nav{background:rgba(244,246,243,.95)}
:root.light-theme .auth-screen{background:radial-gradient(ellipse at top right,#dceee3 0%,var(--bg) 58%)}
:root.light-theme .auth-card{background:rgba(255,255,255,.97);box-shadow:0 24px 80px rgba(30,50,30,.12)}
:root.light-theme .chart .gl{stroke:var(--surface)}
:root.light-theme .month-h{background:#e1efe5}
:root.light-theme .month-h p{color:#4d7059}
:root.light-theme .daystrip button.on{color:#fff}
:root.light-theme .daystrip button.on b{color:#fff}
.theme-toggle{margin-inline-start:auto}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.btn{transition:none}}
.grid3{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px}
.day{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.day-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-inline:2px;margin-block:0;color:var(--fg);font-size:15px;font-weight:400}
.day-h h2{font-size:20px;font-weight:800;line-height:1.3}
.day-h p{font-size:13px}
.day-tot{text-align:left}
.day-tot b{display:block;font-size:20px;font-weight:800;color:var(--accent);line-height:1.3}
.day-tot small{font-size:12px;color:var(--muted)}
.day-chips{display:flex;gap:8px;flex-wrap:wrap}
.pur{display:flex;flex-direction:column;gap:8px}
.pur-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.pitems{display:flex;flex-direction:column}
.pit{display:flex;justify-content:space-between;gap:12px;padding-block:10px;border-top:1px dashed var(--line)}
.pit-main{display:flex;flex-direction:column;min-width:0}
.pit-main b{font-size:15.5px;font-weight:700;overflow-wrap:anywhere}
.pit-main span{font-size:13px;color:var(--muted)}
.pit-main .disc{color:var(--red-fg)}
.pit-tot{font-size:16px;font-weight:800;white-space:nowrap}
.pur-r{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.pur-r.neg span:last-child{color:var(--red-fg)}
.pur-r.tot{padding-top:10px;border-top:1px solid var(--line);align-items:baseline}
.pur-r.tot b{font-size:18px;font-weight:800;color:var(--fg)}
.edit-banner{border-color:var(--green);background:var(--green-deep)}
.edit-banner b{font-size:15px}
.edit-banner p{font-size:13px}
.month-h{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--green-deep);border:1px solid var(--green);border-radius:16px;padding:12px 14px;margin-top:14px}
.month-h h2{font-size:19px;font-weight:800;line-height:1.3}
.month-h p{font-size:12.5px;color:#a9c9b8}
.daystrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.daystrip::-webkit-scrollbar{display:none}
.daystrip button{flex:none;min-width:74px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:14px;padding:7px 12px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-size:12px;line-height:1.55}
.daystrip button b{font-size:14px;font-weight:700;color:var(--fg);white-space:nowrap}
.daystrip button.on{background:var(--green);border-color:var(--green-hi);color:#d6ecdf}
.daystrip button.on b{color:#fff}

/* --- account / sign-in --- */
.auth-screen{position:fixed;inset:0;z-index:100;overflow:auto;background:radial-gradient(ellipse at top right,#123626 0%,var(--bg) 58%);padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center}
.auth-card{width:100%;max-width:420px;background:rgba(18,22,18,.96);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 80px rgba(0,0,0,.28)}
.auth-logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--accent);font-size:28px;font-weight:800}
.auth-card h2{font-size:25px;font-weight:800}.auth-card p{font-size:13.5px;color:var(--muted)}
.auth-card .auth-error{color:var(--red-fg);font-size:13px;min-height:0}.auth-card .auth-error:empty{display:none}
.auth-card .auth-links{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.auth-card .auth-links button{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer}
body.auth-required .top,body.auth-required #view,body.auth-required #nav,body.auth-required #sheetwrap{display:none!important}
</style>


<section id="auth-screen" class="auth-screen" hidden aria-labelledby="auth-title">
  <div class="auth-card">
    <div class="auth-logo" aria-hidden="true">ا</div>
    <div><h2 id="auth-title">ورود به انیار</h2><p id="auth-subtitle">برای دیدن و همگام‌سازی اطلاعات کافه وارد حساب خودت شو.</p></div>
    <label class="f">ایمیل<input id="auth-email" type="email" autocomplete="email" placeholder="name@example.com" dir="ltr" required></label>
    <label class="f">رمز عبور<input id="auth-password" type="password" autocomplete="current-password" placeholder="حداقل ۶ کاراکتر" dir="ltr" minlength="6" required></label>
    <p id="auth-error" class="auth-error" role="status" aria-live="polite"></p>
    <button class="btn wide" id="auth-submit" data-auth="signin">ورود امن</button>
    <div class="auth-links"><span id="auth-switch-label">حساب نداری؟</span><button type="button" id="auth-switch">ساخت حساب جدید</button></div>
    <p>اطلاعات هر حساب به‌صورت جداگانه ذخیره می‌شود. برای بازیابی اطلاعات، از همان ایمیل استفاده کن.</p>
  </div>
</section>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="#121612" stroke="#252c26"/><circle cx="24" cy="24" r="11" fill="none" stroke="#2f8a61" stroke-width="5"/><circle cx="35" cy="13" r="4.5" fill="#8c2128"/></svg>
    <div><h1>انیار</h1><p id="today" class="num"></p></div>

}

/* ---------- inventory engine ---------- */
/* Every stock change is an event. Stock and "how many days it lasted" are recomputed from events,
   so editing or deleting a purchase can never leave the numbers out of sync. */
function replay(){
  const map={};
  for(const p of S.products)map[p.id]={stock:0,cycles:[],cur:null};
  const ev=S.events.slice().sort((a,b)=>(a.t-b.t)||(a.id<b.id?-1:1));
  for(const e of ev){
    const m=map[e.pid];if(!m)continue;
    const before=m.stock;
    m.stock=Math.max(0,r3(before+e.delta));
    if(e.delta>0){
      if(before===0){m.cur={start:e.t,end:null,qty:e.delta,used:0,fromInit:e.kind==='init'};m.cycles.push(m.cur)}
      else if(m.cur){m.cur.qty=r3(m.cur.qty+e.delta)}
    }else{
      const used=before-m.stock;
      if(m.cur)m.cur.used=r3(m.cur.used+used);
      if(m.stock===0&&m.cur){m.cur.end=e.t;m.cur=null}
    }
  }
  return map;
}
function lifeStats(m){
  const done=m.cycles.filter(c=>c.end&&!c.fromInit);
  const days=done.map(c=>(c.end-c.start)/DAY);
  const avg=days.length?days.reduce((a,b)=>a+b,0)/days.length:null;
  const lastC=m.cycles.filter(c=>c.end).slice(-1)[0];
  const last=lastC?(lastC.end-lastC.start)/DAY:null;
  let remain=null;
  if(m.cur&&m.stock>0){
    const el=(Date.now()-m.cur.start)/DAY;
    if(m.cur.used>0&&el>=0.25)remain=m.stock/(m.cur.used/el);
    else if(avg!=null)remain=Math.max(0,avg-el);
  }
  return{avg,last,remain,count:done.length};
}
const findProduct=name=>{const n=norm(name);return n?S.products.find(p=>norm(p.name)===n)||null:null};
function status(p){
  const st=(R[p.id]||{stock:0}).stock;
  if(st===0)return'empty';
  if(num(p.min)>0&&st<=num(p.min))return'low';
  return'ok';
}

/* ---------- purchase math ---------- */
function calcLine(it){
  const sub=Math.round(num(it.price)*num(it.qty));
  let d=it.dtype==='pct'?sub*Math.min(100,Math.max(0,num(it.dval)))/100:num(it.dval);
  d=Math.round(Math.min(sub,Math.max(0,d)));
  return{sub,disc:d,total:sub-d};
}
function calcInvoice(d){
  let sub=0,ld=0;
  for(const it of d.items){const l=calcLine(it);sub+=l.sub;ld+=l.disc}
  const after=sub-ld;
  let idc=d.invType==='pct'?after*Math.min(100,Math.max(0,num(d.invVal)))/100:num(d.invVal);
  idc=Math.round(Math.min(after,Math.max(0,idc)));
  return{sub,ld,idc,total:after-idc};
}
function makeInvoice(id,t,raw,invType,invVal,applyStock){
  const c=calcInvoice({items:raw,invType,invVal});
  const items=raw.map(it=>{
    const l=calcLine(it);
    return{pid:it.pid||null,name:String(it.name).trim(),unit:it.unit||'',price:num(it.price),qty:num(it.qty),dtype:it.dtype||'pct',dval:num(it.dval),sub:l.sub,disc:l.disc,total:l.total};
  });
  return{id,t,type:'buy',items,subtotal:c.sub,lineDisc:c.ld,invType,invVal:num(invVal),invDisc:c.idc,total:c.total,applyStock:!!applyStock};
}
/* adds or replaces a purchase and rebuilds its stock events */
function addInvoice(inv){
  S.invoices=S.invoices.filter(i=>i.id!==inv.id);
  S.invoices.push(inv);S.invoices.sort((a,b)=>b.t-a.t);
  S.events=S.events.filter(e=>e.invoiceId!==inv.id);
  if(inv.applyStock){
    for(const ln of inv.items){
      if(!ln.pid)continue;
      const p=S.products.find(x=>x.id===ln.pid);
      const stockQty=p?convertQty(ln.qty,ln.unit||p.unit,p.unit):ln.qty;
      S.events.push({id:uid(),t:inv.t,pid:ln.pid,delta:stockQty,kind:'buy',invoiceId:inv.id,cost:ln.price});
      if(p&&ln.price>0)p.cost=convertUnitPrice(ln.price,ln.unit||p.unit,p.unit);
    }
  }
}

function updateTotals(){

function saveInvoice(){
  const d=S.draft;
  const items=d.items.filter(it=>norm(it.name)&&num(it.price)>0&&num(it.qty)>0);
  if(!items.length){toast('حداقل یک کالا با نام، قیمت و تعداد وارد کن',true);return}
  const editing=!!S.editing;
  const t=draftTime();
  const raw=items.map(it=>{
    const enteredUnit=unitLabel(it.unit||'عدد');
    let p=findProduct(it.name);
    if(!p&&d.applyStock){p={id:uid(),name:it.name.trim(),unit:enteredUnit,category:unitKind(enteredUnit),price:0,cost:num(it.price),min:0};S.products.push(p)}
    return{...it,pid:p?p.id:null,unit:enteredUnit};
  });
  addInvoice(makeInvoice(editing?S.editing:uid(),t,raw,d.invType,d.invVal,d.applyStock));
  S.editing=null;S.draft=newDraft();saveNow();
  if(editing)S.tab='history';
  S.day=jKey.format(t);
  render();
  toast(editing?'تغییرات ذخیره شد':'خرید ثبت شد');
}
function startEdit(id){
  const inv=S.invoices.find(i=>i.id===id);if(!inv)return;
  const ago=Math.max(0,Math.round((startOfDay(Date.now())-startOfDay(inv.t))/DAY));
  S.editing=id;
  S.draft={type:'buy',items:inv.items.map(it=>({id:uid(),name:it.name,pid:it.pid,unit:it.unit||((S.products.find(p=>p.id===it.pid)||{}).unit)||'عدد',price:String(it.price),qty:String(it.qty),dtype:it.dtype||'pct',dval:it.dval?String(it.dval):''})),
    invType:inv.invType||'pct',invVal:inv.invVal?String(inv.invVal):'',applyStock:inv.applyStock!==false,ago:String(ago),origAgo:ago};

}

function dayHTML(g){

    <div class="day-chips"><span class="chip num">${fa(lines)} قلم</span><span class="chip num">جمع تعداد ${fa(qty)}</span>${g.list.length>1?`<span class="chip num">${fa(g.list.length)} بار خرید</span>`:''}</div>
    ${g.list.map(inv=>purchaseCard(inv)).join('')}
  </section>`;

function viewHistory(v){
  const list=purchases();
  if(!list.length){
    v.innerHTML=`<div class="card empty">${IC.list}<h3>هنوز خریدی ثبت نشده</h3><p>بعد از ثبت اولین خرید، لیست هر روز جدا جدا اینجا نشون داده میشه.</p><button class="btn" data-act="tab" data-v="invoice">ثبت خرید</button></div>`;return;
  }
  const groups=[];
  for(const inv of list){
    const k=jKey.format(inv.t);let g=groups[groups.length-1];
    if(!g||g.k!==k){g={k,t:inv.t,list:[]};groups.push(g)}
    g.list.push(inv);
  }
  /* day strip: today (even if empty) + every day that has purchases */
  const days=groups.slice(),tk=jKey.format(Date.now());
  if(!days.some(g=>g.k===tk))days.unshift({k:tk,t:Date.now(),list:[]});
  if(S.day!=='all'&&!days.some(g=>g.k===S.day))S.day=groups[0].k;
  const strip=`<div class="daystrip" role="tablist" aria-label="روزهای خرید"><button role="tab" data-act="day" data-v="all" class="${S.day==='all'?'on':''}"><span>همه</span><b>روزها</b></button>`
    +days.map(g=>`<button role="tab" data-act="day" data-v="${g.k}" class="${S.day===g.k?'on':''}"><span>${wdShort.format(g.t)}</span><b class="num">${jDay.format(g.t)}</b></button>`).join('')+`</div>`;
  let html=strip;
  if(S.day!=='all'){
    html+=dayHTML(days.find(g=>g.k===S.day));
  }else{
    const allTotal=sum(list,i=>i.total),allLines=sum(list,i=>i.items.length),allQty=sum(list,i=>sum(i.items,x=>x.qty));
    html+=`<div class="card grid3">
      <div class="stat good"><small>جمع همه خریدها</small><b class="num">${money(allTotal)}<em>تومان</em></b></div>
      <div class="stat"><small>تعداد قلم</small><b class="num">${fa(allLines)}</b></div>
      <div class="stat"><small>جمع تعداد</small><b class="num">${fa(allQty)}</b></div></div>`;
    const months=[];
    for(const g of groups){
      const k=jMK.format(g.t);let m=months[months.length-1];
      if(!m||m.k!==k){m={k,t:g.t,days:[]};months.push(m)}
      m.days.push(g);
    }
    for(const m of months){
      const invs=m.days.flatMap(g=>g.list);
      html+=`<div class="month-h"><div><h2>${jMY.format(m.t)}</h2><p class="num">${fa(m.days.length)} روز خرید · ${fa(sum(invs,i=>i.items.length))} قلم · جمع تعداد ${fa(sum(invs,i=>sum(i.items,x=>x.qty)))}</p></div><div class="day-tot"><b class="num">${money(sum(invs,i=>i.total))}</b><small>تومان</small></div></div>`;
      for(const g of m.days)html+=dayHTML(g);
    }
  }
  v.innerHTML=html;
  try{const on=v.querySelector('.daystrip .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
}

/* --- report view (purchases only) --- */
function viewReport(v){
  const now=Date.now(),P=S.period;
  const from=P==='today'?startOfDay(now):P==='all'?0:P==='month'?monthStart(now):now-Number(P)*DAY;
  const inv=purchases().filter(i=>i.t>=from);
  const total=sum(inv,i=>i.total),disc=sum(inv,i=>i.lineDisc+i.invDisc);
  const lines=sum(inv,i=>i.items.length),qty=sum(inv,i=>sum(i.items,x=>x.qty));
  const days=[];
  for(let k=6;k>=0;k--){
    const s=startOfDay(now-k*DAY);
    days.push({s,label:wdShort.format(s),v:sum(purchases().filter(i=>i.t>=s&&i.t<s+DAY),i=>i.total),today:k===0});
  }
  const max=Math.max(1,...days.map(d=>d.v));
  const W=320,H=130,top=14,bot=112,bw=30,slot=W/7;
  const bars=days.map((d,i)=>{
    const h=Math.max(d.v>0?3:0,(bot-top)*d.v/max);
    return`<rect class="bar ${d.today?'today':''}" x="${(i*slot+(slot-bw)/2).toFixed(1)}" y="${(bot-h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="6"/><text x="${(i*slot+slot/2).toFixed(1)}" y="126" text-anchor="middle">${d.label}</text>`;
  }).join('');
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار خرید هفت روز اخیر"><line class="grid" x1="0" x2="${W}" y1="${top}" y2="${top}"/><line class="grid" x1="0" x2="${W}" y1="${(top+bot)/2}" y2="${(top+bot)/2}"/><line class="grid" x1="0" x2="${W}" y1="${bot}" y2="${bot}"/>${bars}<text class="gl" x="2" y="${top-3}">${money(max)}</text><text class="gl" x="2" y="${(top+bot)/2-3}">${money(max/2)}</text></svg>`;
  const agg={};
  for(const i of inv)for(const it of i.items){const k=norm(it.name);(agg[k]=agg[k]||{name:it.name,unit:it.unit,qty:0,rev:0});agg[k].qty+=it.qty;agg[k].rev+=it.total}
  const top5=Object.values(agg).sort((a,b)=>b.rev-a.rev).slice(0,5),mx=top5.length?top5[0].rev||1:1;
  const al=alerts();
  v.innerHTML=`
    <div class="seg" id="perSeg">${[['today','امروز'],['7','۷ روز'],['month','این ماه'],['all','همه']].map(([k,l])=>`<button data-act="period" data-v="${k}" class="${P===k?'on':''}">${l}</button>`).join('')}</div>
    <div class="card grid2" style="row-gap:16px">
      <div class="stat good" style="grid-column:1/-1"><small>جمع خرید</small><b class="num">${money(total)}<em>تومان</em></b></div>
      <div class="stat"><small>تعداد قلم</small><b class="num">${fa(lines)}</b></div>
      <div class="stat"><small>جمع تعداد</small><b class="num">${fa(qty)}</b></div>
      <div class="stat" style="grid-column:1/-1"><small>تخفیف گرفته‌شده</small><b class="num">${money(disc)}<em>تومان</em></b></div>
    </div>
    <div class="card stack"><p class="sec-title" style="margin:0">خرید ۷ روز اخیر (تومان)</p>${chart}</div>
    <div class="card stack"><p class="sec-title" style="margin:0">بیشترین خرج</p>${top5.length?`<div class="rank">${top5.map(t=>`<div class="it"><div class="h"><span>${esc(t.name)} <span class="muted num">× ${fa(t.qty)}</span></span><span class="num">${money(t.rev)}</span></div><div class="meter"><i style="width:${Math.max(4,t.rev/mx*100).toFixed(0)}%"></i></div></div>`).join('')}</div>`:'<p class="muted">در این بازه خریدی ثبت نشده.</p>'}</div>
    ${al.length?`<div class="card stack"><p class="sec-title" style="margin:0">هشدار موجودی</p>${al.map(p=>`<div class="alert"><b>${esc(p.name)}</b><span class="num">${status(p)==='empty'?'تمام شده':fa(R[p.id].stock)+' '+esc(p.unit)+' مانده'}</span></div>`).join('')}</div>`:''}`;
}

/* --- settings / backup --- */
function settingsSheet(){
  const json=JSON.stringify({app:'aniar',v:1,products:S.products,events:S.events,invoices:S.invoices});
  openSheet(`<h3>تنظیمات و پشتیبان</h3><div class="stack">
    ${storageOK?'':'<div class="alert"><b>ذخیره‌سازی این مرورگر کار نمی‌کنه. حتماً پشتیبان بگیر.</b></div>'}
    <p class="muted" style="font-size:13.5px">اطلاعات بعد از ورود، روی این گوشی و فضای ابری حساب تو ذخیره میشه. برای احتیاط گاهی یه نسخه پشتیبان هم بگیر.</p>
    <label class="f">پشتیبان (متن رو کپی کن)<textarea id="bk" readonly>${esc(json)}</textarea></label>
    <div class="actions"><button class="btn sm" data-act="bk-copy">کپی پشتیبان</button><button class="btn sm ghost" data-act="bk-dl">دانلود فایل</button></div>
    <label class="f">بازیابی (متن پشتیبان رو اینجا بچسبون)<textarea id="rs" placeholder="{...}"></textarea></label>
    <button class="btn ghost" data-act="bk-restore">بازیابی از متن</button>
    <button class="btn danger" data-act="wipe">پاک‌کردن همه اطلاعات</button>
  </div>`);
}
async function restore(){
  let d;
  try{d=JSON.parse($('#rs').value.trim())}catch(e){toast('متن پشتیبان معتبر نیست',true);return}
  if(!d||!Array.isArray(d.products)||!Array.isArray(d.events)||!Array.isArray(d.invoices)){toast('این متن پشتیبان انیار نیست',true);return}
  if(!await ask('اطلاعات فعلی با پشتیبان جایگزین بشه؟','جایگزین کن'))return;
  S.products=d.products;S.events=d.events;S.invoices=d.invoices;S.draft=newDraft();S.editing=null;saveNow();render();toast('بازیابی شد');
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.f||S.tab!=='invoice')return;
  const d=S.draft;
  if(t.dataset.f==='invVal'||t.dataset.f==='ago'){d[t.dataset.f]=t.value}
  else{
    const row=t.closest('[data-i]');if(!row)return;
    const it=d.items[row.dataset.i];if(!it)return;
    it[t.dataset.f]=t.value;
    if(t.dataset.f==='name'){
      const p=findProduct(t.value);it.pid=p?p.id:null;
      if(p){
        if(!it.unit||unitKind(it.unit)!==unitKind(p.unit))it.unit=p.unit;
        refreshInvoiceRowUnit(row,it,p);
        if(!num(it.price)&&num(p.cost)>0){it.price=String(convertUnitPrice(p.cost,p.unit,it.unit));row.querySelector('[data-f=price]').value=it.price}
      }else{refreshInvoiceRowUnit(row,it,null)}
    }
  }
  updateTotals();save();
});
document.addEventListener('change',e=>{
  if(e.target.id==='applyStock'){S.draft.applyStock=e.target.checked;updateTotals();save()}
  if(e.target.matches('#rows [data-f="unit"]')){
    const row=e.target.closest('[data-i]'),it=row&&S.draft.items[row.dataset.i];
    if(it){it.unit=e.target.value;const l=row.querySelector('[data-role="price-label"]');if(l)l.textContent='قیمت هر '+it.unit+' (تومان)';updateTotals();save()}
  }
  if(e.target.id==='pf-category'){
    const units=unitOptions[e.target.value]||unitOptions.count;
    const unit=$('#pf-unit'),initUnit=$('#pf-init-unit');
    if(unit){unit.innerHTML=units.map(u=>`<option value="${u}">${u}</option>`).join('');unit.value=units[0]}
    if(initUnit){initUnit.innerHTML=units.map(u=>`<option value="${u}">${u}</option>`).join('');initUnit.value=units[0]}
  }
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  const row=el.closest('[data-i]'),it=row?S.draft.items[row.dataset.i]:null;
  switch(a){
    case'theme':toggleTheme();break;
    case'tab':S.tab=v;render();scrollTo(0,0);break;
    case'itype':S.draft.invType=v;setSeg($('#invSeg'),v);updateTotals();save();break;
    case'dtype':if(it){it.dtype=v;setSeg(row.querySelector('[data-role=dseg]'),v);updateTotals();save()}break;
    case'addrow':{S.draft.items.push(newItem());renderRows();const ins=document.querySelectorAll('#rows [data-f=name]');ins[ins.length-1].focus();save();break}
    case'delrow':
      if(S.draft.items.length===1)S.draft.items=[newItem()];else S.draft.items.splice(Number(row.dataset.i),1);
      renderRows();save();break;
    case'inc':case'dec':if(it){
      const q=Math.max(0,num(it.qty)+(a==='inc'?1:-1));it.qty=String(r3(q));
      row.querySelector('[data-f=qty]').value=it.qty;updateTotals();save()}break;
    case'clear':
      if(await ask('همه‌ی ردیف‌های این خرید پاک بشه؟','پاک کن')){S.draft=newDraft();saveNow();render()}break;
    case'cancel-edit':S.editing=null;S.draft=newDraft();S.tab='history';saveNow();render();break;
    case'save-invoice':saveInvoice();break;
    case'editinv':startEdit(id);break;
    case'newprod':productForm(null);break;
    case'sample':loadSample();break;
    case'openprod':productSheet(id);break;
    case'editprod':productForm(S.products.find(p=>p.id===id));break;
    case'delprod':
      if(await ask('این کالا و همه‌ی سابقه‌ی انبارش پاک بشه؟','حذف کن')){
        S.products=S.products.filter(p=>p.id!==id);S.events=S.events.filter(x=>x.pid!==id);saveNow();render();toast('کالا حذف شد')}break;
    case'submit-prod':submitProduct(id||null);break;
    case'restock':moveSheet(id,'buy');break;
    case'use':moveSheet(id,'use');break;
    case'submit-move':submitMove(id,el.dataset.kind);break;
    case'delinv':
      if(await ask('این خرید حذف بشه؟ موجودی انبار هم به حالت قبل برمی‌گرده.','حذف کن')){
        S.invoices=S.invoices.filter(i=>i.id!==id);S.events=S.events.filter(x=>x.invoiceId!==id);
        if(S.editing===id){S.editing=null;S.draft=newDraft()}
        saveNow();render();toast('خرید حذف شد')}break;
    case'period':S.period=v;render();break;
    case'day':S.day=v;viewHistory($('#view'));break;
    case'settings':settingsSheet();break;
    case'logout':logout();break;
    case'bk-copy':{
      const ta=$('#bk');
      try{await navigator.clipboard.writeText(ta.value);toast('کپی شد')}catch(err){ta.focus();ta.select();toast('متن انتخاب شد، کپی کن')}break}
    case'bk-dl':{
      try{const u=URL.createObjectURL(new Blob([$('#bk').value],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='aniar-backup.json';document.body.appendChild(l);l.click();l.remove();toast('اگه فایل ذخیره نشد، از «کپی پشتیبان» استفاده کن')}catch(err){toast('دانلود نشد، کپی کن',true)}break}
    case'bk-restore':restore();break;
    case'wipe':
      if(await ask('همه‌ی کالاها، خریدها و سابقه‌ها برای همیشه پاک بشن؟','پاک کن')){
        S.products=[];S.events=[];S.invoices=[];S.draft=newDraft();S.editing=null;saveNow();closeSheet();render();toast('همه‌چیز پاک شد')}break;
    case'closesheet':closeSheet(false);break;
    case'ask-yes':closeSheet(true);break;
    case'ask-no':closeSheet(false);break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetwrap').hidden)closeSheet(false)});


/* ---------- authentication & cloud sync ---------- */
let authUser=null, cloudReady=false, cloudTimer=null, cloudBusy=false, cloudPending=false, authMode='signin';
function showAuth(message=''){document.body.classList.add('auth-required');$('#auth-screen').hidden=false;$('#auth-error').textContent=message}
function hideAuth(){$('#auth-screen').hidden=true;document.body.classList.remove('auth-required');$('#auth-error').textContent=''}
function setAuthMode(mode){
  authMode=mode;const signup=mode==='signup';
  $('#auth-title').textContent=signup?'ساخت حساب انیار':'ورود به انیار';
  $('#auth-subtitle').textContent=signup?'یک حساب بساز تا اطلاعات انیار بین دستگاه‌ها همگام شود.':'برای دیدن و همگام‌سازی اطلاعات کافه وارد حساب خودت شو.';
  $('#auth-submit').textContent=signup?'ساخت حساب':'ورود امن';
  $('#auth-submit').dataset.auth=mode;
  $('#auth-switch-label').textContent=signup?'حساب داری؟':'حساب نداری؟';
  $('#auth-switch').textContent=signup?'برگشت به ورود':'ساخت حساب جدید';
  $('#auth-password').autocomplete=signup?'new-password':'current-password';$('#auth-error').textContent='';
}
function cloudPayload(){return {products:S.products,events:S.events,invoices:S.invoices}}
async function cloudSave(){
  if(!authUser||!cloudReady)return;
  if(cloudBusy){cloudPending=true;return}cloudBusy=true;
  try{
    const {error}=await supabaseClient.from('aniar_user_data').upsert({user_id:authUser.id,data:cloudPayload(),updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(error)throw error;
  }catch(err){console.error('Aniar cloud save failed:',err);toast('ذخیره ابری انجام نشد؛ اتصال و تنظیمات Supabase را بررسی کن',true)}
  finally{cloudBusy=false;if(cloudPending){cloudPending=false;cloudSave()}}
}
const OWNER_KEY='aniar.owner.v1';
async function bootstrapUser(user){
  authUser=user;cloudReady=false;
  try{
    const {data,error}=await supabaseClient.from('aniar_user_data').select('data').eq('user_id',user.id).maybeSingle();
    if(error)throw error;
    const previousOwner=localStorage.getItem(OWNER_KEY);
    if(data&&data.data&&typeof data.data==='object'){
      const d=data.data;S.products=Array.isArray(d.products)?d.products:[];S.events=Array.isArray(d.events)?d.events:[];S.invoices=Array.isArray(d.invoices)?d.invoices:[];
      S.draft=newDraft();S.editing=null;
    }else{
      // Never copy a previous account's local data into a different user's empty cloud account.
      if(previousOwner&&previousOwner!==user.id){
        S.products=[];S.events=[];S.invoices=[];S.draft=newDraft();S.editing=null;
      }
      const {error:saveError}=await supabaseClient.from('aniar_user_data').upsert({user_id:user.id,data:cloudPayload(),updated_at:new Date().toISOString()},{onConflict:'user_id'});
      if(saveError)throw saveError;
    }
    try{localStorage.setItem(OWNER_KEY,user.id)}catch(e){}
    saveNow(true);
    cloudReady=true;hideAuth();render();toast('حساب متصل شد؛ اطلاعات با فضای ابری همگام است');
  }catch(err){console.error('Aniar cloud load failed:',err);cloudReady=false;showAuth('اتصال ابری ناموفق بود. ابتدا supabase/schema.sql را در SQL Editor اجرا کن. '+(err.message||''))}
}
function withRequestTimeout(promise,ms=15000){
  let timer;
  return Promise.race([
    promise,
    new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('درخواست بیش از ۱۵ ثانیه پاسخ نداد. اتصال اینترنت، آدرس Supabase و وضعیت پروژه را بررسی کن.')),ms)})
  ]).finally(()=>clearTimeout(timer));
}
async function submitAuth(){
  const email=$('#auth-email').value.trim().toLowerCase(),password=$('#auth-password').value;
  if(!email||!$('#auth-email').checkValidity()){showAuth('ایمیل معتبر وارد کن.');return}
  if(password.length<6){showAuth('رمز عبور باید حداقل ۶ کاراکتر باشد.');return}
  const button=$('#auth-submit');button.disabled=true;button.textContent='در حال اتصال…';$('#auth-error').textContent='';
  try{
    if(authMode==='signup'){
      const {data,error}=await withRequestTimeout(supabaseClient.auth.signUp({email,password}));if(error)throw error;
      if(!data.session){setAuthMode('signin');$('#auth-email').value=email;showAuth('حساب ساخته شد. اگر تأیید ایمیل در Supabase روشن است، ایمیلت را تأیید کن و بعد وارد شو.');return}
      button.textContent='در حال بارگذاری اطلاعات…';
      await withRequestTimeout(bootstrapUser(data.user));
    }else{
      const {data,error}=await withRequestTimeout(supabaseClient.auth.signInWithPassword({email,password}));if(error)throw error;
      button.textContent='در حال بارگذاری اطلاعات…';
      await withRequestTimeout(bootstrapUser(data.user));
    }
  }catch(err){
    const msg=String(err&&err.message||'خطای نامشخص');
    showAuth(msg.includes('Invalid login credentials')?'ایمیل یا رمز عبور اشتباه است.':msg.includes('Failed to fetch')?'اتصال اینترنت یا تنظیمات Supabase را بررسی کن.':msg);
  }finally{
    button.disabled=false;
    button.textContent=authMode==='signup'?'ساخت حساب':'ورود امن';
  }
}
async function logout(){
  const {error}=await supabaseClient.auth.signOut();if(error){toast('خروج ناموفق بود',true);return}
  authUser=null;cloudReady=false;showAuth();setAuthMode('signin');
}
const THEME_KEY='aniar.theme.v1';
function applyTheme(theme){
  const light=theme==='light';
  document.documentElement.classList.toggle('light-theme',light);
  try{localStorage.setItem(THEME_KEY,light?'light':'dark')}catch(e){}
  const b=document.querySelector('[data-act="theme"]');
  if(b){
    b.setAttribute('aria-label',light?'تغییر به حالت تیره':'تغییر به حالت روشن');
    b.title=light?'تغییر به حالت تیره':'تغییر به حالت روشن';
    b.innerHTML=light
      ? '<svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>'
      : '<svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>';
  }
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=light?'#f4f6f3':'#0b0d0b';
}
function toggleTheme(){applyTheme(document.documentElement.classList.contains('light-theme')?'dark':'light')}
try{applyTheme(localStorage.getItem(THEME_KEY)==='light'?'light':'dark')}catch(e){applyTheme('dark')}
async function initApp(){
  load();setAuthMode('signin');
  $('#auth-submit').addEventListener('click',submitAuth);
  $('#auth-switch').addEventListener('click',()=>setAuthMode(authMode==='signin'?'signup':'signin'));
  $('#auth-password').addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth()});
  $('#auth-email').addEventListener('keydown',e=>{if(e.key==='Enter')$('#auth-password').focus()});
  const {data,error}=await supabaseClient.auth.getSession();
  if(error){showAuth('ورود به Supabase ناموفق بود: '+error.message);return}
  if(data.session?.user)await bootstrapUser(data.session.user);else showAuth();
}

initApp();
</script>
